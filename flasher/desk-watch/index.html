<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk Watch CYD</title>
<script type="module" src="../vendor/esp-web-tools/install-button.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#16202e;--muted:#5b6778;--accent:#0a7cff;--line:#dfe3ec;--note:#ffe14d}
@media (prefers-color-scheme:dark){:root{--bg:#10151d;--card:#18202b;--ink:#e8edf5;--muted:#9aa6b8;--accent:#4da3ff;--line:#2a3544}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 16px 56px}
h1{font-size:1.9rem;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:0 0 18px}
.card h2{font-size:1.1rem;margin:0 0 10px}
ol{margin:0;padding-left:1.2em} li{margin:6px 0}
.install{display:flex;justify-content:center;padding:10px 0 4px}
esp-web-install-button button{font:inherit;font-weight:600;padding:14px 26px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;font-size:1.05rem}
.note{background:var(--note);color:#3a2f00;border-radius:10px;padding:10px 14px;font-size:.95rem}
.muted{color:var(--muted);font-size:.92rem}
#unsupported{display:none}
.lang{display:flex;justify-content:flex-end;gap:6px;margin:0 0 10px}
.lang button{font:inherit;font-size:.9rem;padding:4px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:0;padding:0;list-style:none}
.gal figure{margin:0}
.gal img{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--line);image-rendering:auto;background:#000}
.gal figcaption{font-size:.9rem;color:var(--muted);margin-top:4px;text-align:center}
details{margin-top:8px} summary{cursor:pointer;font-weight:600}
code{background:var(--bg);padding:1px 6px;border-radius:5px}
</style>
</head>
<body>
<main>
  <div class="lang" role="group" aria-label="Language / Langue">
    <button type="button" data-lang="fr" aria-pressed="false">Français</button>
    <button type="button" data-lang="en" aria-pressed="false">English</button>
  </div>
  <h1>Desk Watch CYD</h1>
  <p class="lead" data-t="lead"></p>

  <div class="card">
    <h2 data-t="h_install"></h2>
    <ol>
      <li data-t="s1"></li>
      <li data-t="s2"></li>
      <li data-t="s3"></li>
    </ol>
    <div class="install">
      <esp-web-install-button manifest="manifest.json">
        <button slot="activate" data-t="btn"></button>
        <span slot="unsupported" id="unsupported" data-t="unsup"></span>
        <span slot="not-allowed" data-t="https"></span>
      </esp-web-install-button>
    </div>
    <p class="muted" style="text-align:center;margin:8px 0 0" data-t="browser"></p>
  </div>

  <div class="card">
    <h2 data-t="h_pics"></h2>
    <p class="muted" data-t="pics_note"></p>
    <ul class="gal">
      <li><figure><img data-img="clock" src="img/clock-en.png" width="320" height="240" loading="lazy" alt="" data-alt-fr="Heure" data-alt-en="Clock"><figcaption data-cap-fr="Heure" data-cap-en="Clock"></figcaption></figure></li>
      <li><figure><img data-img="timer" src="img/timer-en.png" width="320" height="240" loading="lazy" alt="" data-alt-fr="Minuteur Pomodoro" data-alt-en="Pomodoro timer"><figcaption data-cap-fr="Minuteur Pomodoro" data-cap-en="Pomodoro timer"></figcaption></figure></li>
      <li><figure><img data-img="stopwatch" src="img/stopwatch-en.png" width="320" height="240" loading="lazy" alt="" data-alt-fr="Chronomètre" data-alt-en="Stopwatch"><figcaption data-cap-fr="Chronomètre" data-cap-en="Stopwatch"></figcaption></figure></li>
      <li><figure><img data-img="counter" src="img/counter-en.png" width="320" height="240" loading="lazy" alt="" data-alt-fr="Compteur" data-alt-en="Counter"><figcaption data-cap-fr="Compteur" data-cap-en="Counter"></figcaption></figure></li>
      <li><figure><img data-img="alarm" src="img/alarm-en.png" width="320" height="240" loading="lazy" alt="" data-alt-fr="Alarme" data-alt-en="Alarm"><figcaption data-cap-fr="Alarme" data-cap-en="Alarm"></figcaption></figure></li>
      <li><figure><img data-img="notes" src="img/notes-en.png" width="320" height="240" loading="lazy" alt="" data-alt-fr="Post-it numérique (18 tâches)" data-alt-en="Digital Post-it (18 tasks)"><figcaption data-cap-fr="Post-it numérique (18 tâches)" data-cap-en="Digital Post-it (18 tasks)"></figcaption></figure></li>
      <li><figure><img data-img="settings" src="img/settings-en.png" width="320" height="240" loading="lazy" alt="" data-alt-fr="Réglages (langue, luminosité, volume)" data-alt-en="Settings (language, brightness, volume)"><figcaption data-cap-fr="Réglages (langue, luminosité, volume)" data-cap-en="Settings (language, brightness, volume)"></figcaption></figure></li>
    </ul>
  </div>

  <div class="card">
    <h2 data-t="h_next"></h2>
    <ul>
      <li data-t="n1"></li>
      <li data-t="n2"></li>
      <li data-t="n3"></li>
      <li data-t="n4"></li>
    </ul>
  </div>

  <div class="card">
    <h2 data-t="h_help"></h2>
    <details><summary data-t="q1"></summary><p class="muted" data-t="a1"></p></details>
    <details><summary data-t="q2"></summary><p class="muted" data-t="a2"></p></details>
    <details><summary data-t="q3"></summary><p class="muted" data-t="a3"></p></details>
    <details><summary data-t="q4"></summary><p class="muted" data-t="a4"></p></details>
  </div>

  <p class="note" data-t="note"></p>
</main>
<script>
const TX={
fr:{h_pics:"Aperçu des pages",pics_note:"Images de l'écran de la carte (rendu fidèle de l'interface).",lead:"Horloge, minuteur Pomodoro, chronomètre, compteur, alarme et Post-it numérique pour la carte ESP32 CYD (2,8 pouces). Installation en un clic depuis cette page.",
h_install:"Installer sur ma carte",
s1:"Branche la carte CYD à l'ordinateur avec un câble USB <strong>qui transmet les données</strong>.",
s2:"Clique sur le bouton ci-dessous, choisis le port de la carte, puis <em>Install</em> (la fenêtre de l'installateur est en anglais).",
s3:"Une fois l'installation terminée, la page te propose de <strong>connecter la carte à ton Wi-Fi</strong> : choisis ton réseau et saisis le mot de passe.",
btn:"Installer Desk Watch",unsup:"Ce navigateur ne sait pas installer par USB. Utilise Chrome ou Edge sur ordinateur.",https:"L'installation demande une page en HTTPS.",
browser:"Navigateur : Chrome ou Edge sur ordinateur (Windows, Mac, Linux, Chromebook). Pas Firefox ni Safari, pas de téléphone.",
h_next:"Ensuite",
n1:"Ouvre <code>http://postit.local/settings</code> (ou le lien proposé après la connexion Wi-Fi) pour choisir la <strong>langue</strong> (français ou anglais) et le <strong>fuseau horaire</strong> (pays puis ville). Par défaut : anglais, Hanoï. L'heure se règle ensuite toute seule par Internet.",
n2:"Pour le Post-it : ouvre <code>http://postit.local</code> sur un téléphone ou un ordinateur connecté au même Wi-Fi. L'adresse IP s'affiche aussi sur la page Notes de la carte.",
n3:"Balayage gauche/droite ou touche les noms en bas de l'écran pour changer de page. La langue se change aussi dans les Réglages de la carte.",
n4:"Touche l'écran pendant le démarrage, ou maintiens 3 secondes une zone vide, pour calibrer le tactile.",
h_help:"Si ça ne marche pas",
q1:"Le port de la carte n'apparaît pas",a1:"Essaie un autre câble USB (certains ne font que charger). Sous Windows, installe le pilote <strong>CH340</strong> ou <strong>CP210x</strong> selon la puce de ta carte, puis débranche et rebranche.",
q2:"L'installation échoue au démarrage",a2:"Maintiens le bouton <strong>BOOT</strong> de la carte pendant que tu cliques sur <em>Install</em>, puis relâche quand l'écriture commence.",
q3:"Je me suis trompé de Wi-Fi",a3:"Recommence l'installation : l'étape Wi-Fi est reproposée à la fin et remplace l'ancien réseau.",
q4:"L'écran a les couleurs inversées",a4:"Dis-le-nous : une variante du firmware existe pour cet écran.",
note:"Programme libre et gratuit pour l'éducation. Le mot de passe Wi-Fi reste dans la mémoire de ta carte : il n'est pas envoyé sur Internet."},
en:{h_pics:"The pages",pics_note:"Images of the board's screen (faithful render of the interface).",lead:"Clock, Pomodoro timer, stopwatch, counter, alarm and digital Post-it for the ESP32 CYD board (2.8 inch). One-click install from this page.",
h_install:"Install on my board",
s1:"Plug the CYD board into your computer with a USB cable that <strong>carries data</strong>.",
s2:"Click the button below, pick the board's port, then <em>Install</em>.",
s3:"When the installation is done, the page offers to <strong>connect the board to your Wi-Fi</strong>: choose your network and type the password.",
btn:"Install Desk Watch",unsup:"This browser cannot install over USB. Use Chrome or Edge on a computer.",https:"Installing requires an HTTPS page.",
browser:"Browser: Chrome or Edge on a computer (Windows, Mac, Linux, Chromebook). Not Firefox or Safari, not a phone.",
h_next:"What next",
n1:"Open <code>http://postit.local/settings</code> (or the link offered after the Wi-Fi step) to choose the <strong>language</strong> (English or French) and the <strong>time zone</strong> (country, then city). Default: English, Hanoi. The time is then set automatically over the Internet.",
n2:"For the Post-it: open <code>http://postit.local</code> on a phone or computer on the same Wi-Fi. The IP address is also shown on the board's Notes page.",
n3:"Swipe left/right or tap the names at the bottom of the screen to change page. The language can also be changed in the board's Settings page.",
n4:"Touch the screen during start-up, or hold an empty area for 3 seconds, to calibrate the touch.",
h_help:"If it does not work",
q1:"The board's port does not appear",a1:"Try another USB cable (some only charge). On Windows, install the <strong>CH340</strong> or <strong>CP210x</strong> driver depending on your board's chip, then unplug and replug.",
q2:"The installation fails at start",a2:"Hold the board's <strong>BOOT</strong> button while you click <em>Install</em>, and release when writing starts.",
q3:"I chose the wrong Wi-Fi",a3:"Run the installation again: the Wi-Fi step is offered again at the end and replaces the old network.",
q4:"The screen colours are inverted",a4:"Let us know: a firmware variant exists for that screen.",
note:"Free software for education. The Wi-Fi password stays in your board's memory: it is never sent over the Internet."}};
function setLang(l,save){
  if(!TX[l])l='en';
  document.documentElement.lang=l;
  document.querySelectorAll('[data-t]').forEach(e=>{e.innerHTML=TX[l][e.dataset.t]});
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===l)));
  document.querySelectorAll('[data-img]').forEach(i=>{i.src='img/'+i.dataset.img+'-'+l+'.png';i.alt=i.dataset['alt'+l[0].toUpperCase()+l.slice(1)]});
  document.querySelectorAll('[data-cap-'+l+']').forEach(c=>{c.textContent=c.getAttribute('data-cap-'+l)});
  if(save){try{localStorage.setItem('dwlang',l)}catch(e){}}
}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang,true));
let l=null;try{l=localStorage.getItem('dwlang')}catch(e){}
if(!l){const q=new URLSearchParams(location.search).get('lang');l=q||((navigator.language||'en').toLowerCase().startsWith('fr')?'fr':'en')}
setLang(l,false);
</script>
</body>
</html>
