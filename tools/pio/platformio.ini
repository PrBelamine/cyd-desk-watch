; PlatformIO project used to build the firmware of the web installer (flasher/).
; The radio makes the program bigger than the default partition: it needs the "Huge APP" scheme (no OTA).
; Normal users do not need it: the Arduino IDE instructions in the README still work.
; The platform below is pinned to Arduino-ESP32 core 3.2.0 (ESP-IDF 5.4): the radio sounds as intended with that core; the newest
; core (3.3.x) gave a duller sound with the same code. Do not move to "stable" without listening to a radio first.
; The flash runs at 80 MHz, like the Arduino IDE default. An image built with the PlatformIO default (40 MHz) restarted every 36 s on one
; test board; the same build at 80 MHz did not. The exact cause was not investigated further.
[env:cyd]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
extra_scripts = pre:patch_audio.py
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
  bodmer/TFT_eSPI@2.5.44
  https://github.com/PaulStoffregen/XPT2046_Touchscreen
  earlephilhower/ESP8266Audio@2.4.1
build_flags =
  -DUSER_SETUP_LOADED=1
  -DUSER_SETUP_ID=8001 -DILI9341_2_DRIVER=1 -DTFT_WIDTH=240 -DTFT_HEIGHT=320
  -DTFT_MISO=12 -DTFT_MOSI=13 -DTFT_SCLK=14 -DTFT_CS=15 -DTFT_DC=2 -DTFT_RST=-1
  -DTFT_BL=21 -DTFT_BACKLIGHT_ON=HIGH -DLOAD_GLCD=1 -DLOAD_FONT2=1 -DSMOOTH_FONT=1
  -DUSE_HSPI_PORT=1 -DSPI_FREQUENCY=55000000 -DSPI_READ_FREQUENCY=20000000 -DSPI_TOUCH_FREQUENCY=2500000
board_build.f_flash = 80000000L
board_build.flash_mode = dio
